---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildah-storage
  namespace: jenkins
  labels:
    app.kubernetes.io/name: buildah-storage
    app.kubernetes.io/component: ci-build-cache
    app.kubernetes.io/managed-by: sre-lab-bootstrap
  annotations:
    sre-lab.io/why: >-
      buildah 的 /var/lib/containers 原为 emptyDir,每次构建从零开始、层无缓存。
      换成 PVC 后同一节点的后续构建可复用已有的层。
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
