---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: external-git
    app.kubernetes.io/managed-by: sre-lab-bootstrap
  annotations:
    sre-lab.io/why: >-
      集群内 gitea 短名的解析必须由集群内的声明式对象提供。k8s 短名只在同命名空间解析,
      因此消费方命名空间各需一份。此前解析依赖宿主机容器运行时的副作用,容器一停即 NXDOMAIN。
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gitea
  namespace: argocd
subsets:
  - addresses:
      - ip: 172.18.0.8
    ports:
      - name: http
        port: 3000
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: jenkins
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: external-git
    app.kubernetes.io/managed-by: sre-lab-bootstrap
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gitea
  namespace: jenkins
subsets:
  - addresses:
      - ip: 172.18.0.8
    ports:
      - name: http
        port: 3000
        protocol: TCP
