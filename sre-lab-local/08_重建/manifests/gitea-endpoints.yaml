# 让集群内的 Pod 能用固定名字 gitea 找到集群外的 Gitea 容器。
#
# 背景：Gitea 不在集群里，是宿主 docker 容器，接在 k3d-ai-cluster 网络（172.18.0.0/16）上。
# 集群内的 Pod 不能用 docker 的容器名解析（Pod 在 10.42.x.x 的集群网段，不同 netns），
# 所以照 postgres 那套做法：**selector-less Service + 手工 Endpoints**，
# 把集群外的地址投影成集群内的服务发现条目。
#
# 为什么 Service 是两份（argocd / jenkins）：k8s 短名只在**同命名空间**解析，
# 消费方各需一份。两处 clusterIP 不同，名字相同。
#
# ── 地址为什么取 172.18.0.1，而不是 Gitea 容器的 IP ─────────────────────────
#   172.18.0.1 是 k3d 网络的**网关**（= WSL 宿主）。Gitea 用 -p 3001:3000 把端口发布在宿主上，
#   所以 pod → 172.18.0.1:3001 → 宿主的 docker-proxy → Gitea 容器。Service 端口仍是 3000，
#   所以集群内的消费方一律写 gitea:3000，端口映射的差异被 Endpoints 吸收。
#
#   取值只依赖两样东西：**k3d 网络的网段** 和 **Gitea 发布了宿主端口**。两者都写在配置里。
#   Gitea 容器自己的 IP 则由 docker IPAM 按容器**创建顺序**分配 —— 宿主重启 / 容器重建都可能换号。
#   2026-09-19 的事故就是这么来的：Endpoints 里写死 172.18.0.8（当时的 Gitea），
#   宿主重启后 172.18.0.8 变成了 k3s server-0 节点，Gitea 漂到 172.18.0.5，
#   于是 6 条 Application 全部 Sync=Unknown，报的是 connection refused。
#   → 容器 IP 是**会漂的量**，不能写进声明式对象；网关地址不是。
#
# ── 代价与失效模式（必须知道，否则就是下一个静默失效点）────────────────────
#   1. 多一跳 NAT（宿主 docker-proxy）。实测握手 0ms 量级，无关紧要。
#   2. 若哪天 Gitea 不再发布宿主端口（比如改成 --network 直连不 publish，或换了宿主端口），
#      **本对象会立刻失效，而且集群侧不会报错** —— 只有去连它的组件会 connection refused。
#      所以 gitea_up.sh 第 4 步会实测这条路径（集群内 curl gitea:3000），失败就红字退出。
#   3. 若整张 k3d 网络被重建且换了网段，网关地址会变。
#      同样由 gitea_up.sh 第 4 步从 `docker network inspect` 读实际网关来核对并纠正。
#   4. 更彻底的解法是「Gitea 也进集群」（Deployment + 真 Service + PVC）。
#      本文件的前提是"Gitea 刻意留在集群外"，那是教学接缝本身，本轮不动。
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: external-git
    app.kubernetes.io/managed-by: sre-lab-bootstrap
  annotations:
    sre-lab.io/why: >-
      集群内 gitea 短名的解析必须由集群内的声明式对象提供。k8s 短名只在同命名空间解析,
      因此消费方命名空间各需一份。此前解析依赖宿主机容器运行时的副作用,容器一停即 NXDOMAIN。
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gitea
  namespace: argocd
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: external-git
    app.kubernetes.io/managed-by: sre-lab-bootstrap
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: http
        port: 3001
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: jenkins
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: external-git
    app.kubernetes.io/managed-by: sre-lab-bootstrap
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: gitea
  namespace: jenkins
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/component: external-git
    app.kubernetes.io/managed-by: sre-lab-bootstrap
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: http
        port: 3001
        protocol: TCP
