- apiVersion: v1
  data:
    Corefile: |
      .:53 {
          errors
          health
          ready
          kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
          }
          hosts /etc/coredns/NodeHosts {
            ttl 60
            reload 15s
            fallthrough
          }
          prometheus :9153
          forward . /etc/resolv.conf
          cache 30
          loop
          reload
          loadbalance
          import /etc/coredns/custom/*.override
      }
      import /etc/coredns/custom/*.server
    NodeHosts: |
      172.18.0.3 k3d-ai-cluster-agent-1
      172.18.0.4 k3d-ai-cluster-agent-0
      172.18.0.5 k3d-ai-cluster-server-0
