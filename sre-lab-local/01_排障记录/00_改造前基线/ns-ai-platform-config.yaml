apiVersion: v1
items:
- apiVersion: v1
  data:
    snapshot.json: |-
      {
        "version": "1",
        "policyName": "cost-first-default",
        "rolloutPercentage": 100,
        "rules": [
          {
            "id": "rule-001",
            "priority": 100,
            "condition": {
              "tokenCount": "\u003c 200",
              "cacheHitProbability": "\u003e 0.5"
            },
            "action": {
              "tier": "ollama-service",
              "fallbackChain": [
                "ollama-service",
                "vllm-3b-service"
              ]
            }
          },
          {
            "id": "rule-002",
            "priority": 90,
            "condition": {
              "complexity": "high"
            },
            "action": {
              "tier": "vllm-3b-service",
              "fallbackChain": [
                "vllm-3b-service",
                "ollama-service"
              ]
            }
          }
        ],
        "slo": {
          "low": 200,
          "medium": 1000,
          "high": 5000
        },
        "generation": 4,
        "tiers": [
          {
            "name": "vllm-3b-service",
            "healthy": true,
            "predictedP99Ms": 300,
            "marginalMs": 80
          }
        ]
      }
  kind: ConfigMap
  metadata:
    creationTimestamp: "2026-08-06T12:35:20Z"
    labels:
      app.kubernetes.io/part-of: cyberrouter
    name: cyberrouter-routing-snapshot
    namespace: ai-platform
    resourceVersion: "173775"
    uid: ad6e162a-0c53-48b9-9e99-cd946292f726
- apiVersion: v1
  data:
    gateway_config.yaml: |
      server:
        host: "0.0.0.0"
        port: 8000

      ollama:
        base_url: "http://ollama-service:11434"
        default_model: "qwen2.5:1.5b"
        timeout: 120

      auth:
        enabled: false
        jwt_secret: "ai-infra-gateway-jwt-secret-key-2026"
        jwt_algorithm: "HS256"
        jwt_expire_minutes: 60
        api_keys:
          - "sk-infra-gateway-dev-key-2026"

      rate_limit:
        enabled: true
        capacity: 10
        refill_rate: 5

      circuit_breaker:
        enabled: true
        failure_threshold: 3
        timeout_seconds: 30
        half_open_requests: 1

      retry:
        enabled: true
        max_attempts: 2
        backoff_seconds: 1

      # cache-aware 动态加权 (CyberRouter §5.1 联动): 判定 tier 过载时, 用实测命中率打折预判 P99
      #   命中率高 → 缓存请求廉价 (免 prefill) → 有效 P99 低 → tier 更不易被降级走 (等价"权重上调")
      # boost: 折扣系数, 0=关闭, 0.5=满命中时有效 P99 减半 (启发式初值, 需真实负载标定)
      cache_aware:
        boost: 0.5

      backends:
        cpu_ollama:
          base_url: "http://ollama-service:11434"
          type: "ollama"
          models:
            - "qwen2.5:1.5b"
            - "qwen2.5:3b"
            - "qwen2.5"
        gpu_vllm:
          base_url: "http://vllm-3b-service:8000"
          type: "vllm_openai"
          models:
            - "qwen2.5-3b-awq"
            - "qwen2.5:3b"

      # CyberRouter 数据面: 快照 tier 名 → 实际后端 (快照优先路由, 见 route_request)
      # default_model: 路由到此 tier 时, 请求 model 名映射为该后端支持的模型
      tiers:
        ollama-service:
          base_url: "http://ollama-service:11434"
          type: "ollama"
          default_model: "qwen2.5:1.5b"
        vllm-3b-service:
          base_url: "http://vllm-3b-service:8000"
          type: "vllm_openai"
          default_model: "/models/qwen2.5-3b-awq"
  kind: ConfigMap
  metadata:
    annotations:
      kubectl.kubernetes.io/last-applied-configuration: |
        {"apiVersion":"v1","data":{"gateway_config.yaml":"server:\n  host: \"0.0.0.0\"\n  port: 8000\n\nollama:\n  base_url: \"http://ollama-service:11434\"\n  default_model: \"qwen2.5:1.5b\"\n  timeout: 120\n\nauth:\n  enabled: false\n  jwt_secret: \"ai-infra-gateway-jwt-secret-key-2026\"\n  jwt_algorithm: \"HS256\"\n  jwt_expire_minutes: 60\n  api_keys:\n    - \"sk-infra-gateway-dev-key-2026\"\n\nrate_limit:\n  enabled: true\n  capacity: 10\n  refill_rate: 5\n\ncircuit_breaker:\n  enabled: true\n  failure_threshold: 3\n  timeout_seconds: 30\n  half_open_requests: 1\n\nretry:\n  enabled: true\n  max_attempts: 2\n  backoff_seconds: 1\n\n# cache-aware 动态加权 (CyberRouter §5.1 联动): 判定 tier 过载时, 用实测命中率打折预判 P99\n#   命中率高 → 缓存请求廉价 (免 prefill) → 有效 P99 低 → tier 更不易被降级走 (等价\"权重上调\")\n# boost: 折扣系数, 0=关闭, 0.5=满命中时有效 P99 减半 (启发式初值, 需真实负载标定)\ncache_aware:\n  boost: 0.5\n\nbackends:\n  cpu_ollama:\n    base_url: \"http://ollama-service:11434\"\n    type: \"ollama\"\n    models:\n      - \"qwen2.5:1.5b\"\n      - \"qwen2.5:3b\"\n      - \"qwen2.5\"\n  gpu_vllm:\n    base_url: \"http://vllm-3b-service:8000\"\n    type: \"vllm_openai\"\n    models:\n      - \"qwen2.5-3b-awq\"\n      - \"qwen2.5:3b\"\n\n# CyberRouter 数据面: 快照 tier 名 → 实际后端 (快照优先路由, 见 route_request)\n# default_model: 路由到此 tier 时, 请求 model 名映射为该后端支持的模型\ntiers:\n  ollama-service:\n    base_url: \"http://ollama-service:11434\"\n    type: \"ollama\"\n    default_model: \"qwen2.5:1.5b\"\n  vllm-3b-service:\n    base_url: \"http://vllm-3b-service:8000\"\n    type: \"vllm_openai\"\n    default_model: \"/models/qwen2.5-3b-awq\"\n"},"kind":"ConfigMap","metadata":{"annotations":{},"creationTimestamp":null,"name":"gateway-config","namespace":"ai-platform"}}
