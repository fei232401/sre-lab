---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-exporter
  namespace: ai-platform
  labels:
    app: ollama-exporter
    app.kubernetes.io/name: ollama-exporter
    app.kubernetes.io/part-of: ai-platform
    release: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama-exporter
  template:
    metadata:
      labels:
        app: ollama-exporter
        app.kubernetes.io/name: ollama-exporter
        app.kubernetes.io/part-of: ai-platform
        release: monitoring
      annotations:
        prometheus.io/scrape: "false"
    spec:
      containers:
      - name: exporter
        image: k3d-sre-registry:5000/sre-lab/ollama-exporter:e469f7f
        ports:
        - name: metrics
          containerPort: 9101
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-exporter
  namespace: ai-platform
  labels:
    app: ollama-exporter
    app.kubernetes.io/name: ollama-exporter
    release: monitoring
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 9101
    targetPort: 9101
    protocol: TCP
  selector:
    app: ollama-exporter
