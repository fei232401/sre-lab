# Jaeger all-in-one —— 教学规模的"追踪后端"（单进程：collector + query + UI）
#
# 刻意选的形态与代价（诚实标注）：
#   ✅ 单副本、内存存储 —— 重启就丢，没有持久化、没有采样策略、没有弹性
#   ❌ 生产上应该用 Jaeger + 外部存储（ES/Cassandra）或 Tempo，并且按 trace 量做采样
#   教学规模的目的是"把一条 trace 看懂"，不是"存三个月的链路数据"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
    release: monitoring
    app.kubernetes.io/part-of: sre-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
            # 内存存储，硬上限：超了丢最老的，避免把节点内存吃穿
            - { name: MEMORY_MAX_TRACES, value: "10000" }
            - { name: LOG_LEVEL, value: "info" }
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 384Mi }
          readinessProbe:
            httpGet: { path: /, port: 16686 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: monitoring
  labels:
    app: jaeger
    release: monitoring
spec:
  selector:
    app: jaeger
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  namespace: monitoring
  labels:
    app: jaeger
    release: monitoring
spec:
  selector:
    app: jaeger
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
