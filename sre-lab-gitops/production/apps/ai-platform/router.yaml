# platform 决策执行器（router）在生产命名空间的落地清单。
#
# 它的位置：夹在「控制层的决策」与「真实推理后端」之间。
#   控制层算排名 + 记决策，但**不调用**后端；
#   ollama / vLLM 能生成，但**没人调**；
#   router 就是把这两头接起来的那一刀。
#
# 与 api / web 的清单相比，它有两处不同：
#   1. **不需要任何 Secret** —— 它不连库，对控制层用的是调用方传来的 X-API-Key（透传鉴权）
#   2. readiness 会去探控制层 —— 依赖不在就不该接流量，所以控制层抖动时 router 会短暂 NotReady
#
# image 那一行的 tag 由 Jenkins 的 Update GitOps 阶段 sed 改写，平时不要手工改。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-infra-platform-router
  namespace: ai-platform
  labels:
    app: ai-infra-platform-router
    app.kubernetes.io/name: ai-infra-platform-router
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-infra-platform-router
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-infra-platform-router
    spec:
      nodeSelector:
        node-role: cpu
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: router
          image: k3d-sre-registry:5000/platform/ai-infra-platform-router:f189ee1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: production
            # 控制层的 Service FQDN。用完整名字：短名只在同命名空间内可解析
            # （这里同命名空间，但保持与 api 的 DSN 一致的口径，避免以后搬家踩坑）
            - name: CONTROL_PLANE_URL
              value: http://ai-infra-platform-api.ai-platform.svc.cluster.local:8000
            - name: DEFAULT_POLICY
              value: weighted_random
            - name: DEFAULT_MAX_TOKENS
              value: "128"
            # 后端生成可能很慢（CPU 上的 3B 实测 11.87s，冷加载更久），超时要给够
            - name: REQUEST_TIMEOUT_SECONDS
              value: "240"
          # ⚠️ 这两个字段必须在**容器**级。写进 Pod 级 securityContext 会被 API server
          # 静默裁掉（不报错），于是"清单里有、集群里没有"→ ArgoCD 永远 OutOfSync。
          # 本项目在 web 的清单上实测踩过一次（踩坑 P37）。
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            # 就绪 = 控制层可达。**这不是形式**：router 的每一次请求都要先问控制层拿决策，
            # 控制层不在，router 接了流量也只能返回 502。
            httpGet:
              path: /readyz
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            # 存活只看进程还在不在，不探控制层 —— 依赖抖一下不该把 Pod 杀掉重启
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-infra-platform-router
  namespace: ai-platform
  labels:
    app: ai-infra-platform-router
    app.kubernetes.io/name: ai-infra-platform-router
    app.kubernetes.io/part-of: ai-platform
spec:
  type: ClusterIP
  selector:
    app: ai-infra-platform-router
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
#
# 浏览器怎么够到它：经 web 的 nginx 再加一条反代（`/v1/` → 本 Service）。
# 宿主机到不了任何 ClusterIP，所以「前端 → router」这一跳必须复用 web 那个 Pod 的 nginx。
