# 让集群内的 Pod 能用固定名字 postgres 找到 PostgreSQL。
#
# 背景：PG 不在集群里，是 docker 容器 pg-platform，接在 k3d-ai-cluster 网络（172.18.0.0/16）上。
# 集群内的 Pod 不能用 docker 的容器名解析（Pod 在 10.42.x.x 的集群网段，不同 netns），
# 所以照 gitea 那套做法：**selector-less Service + 手工 Endpoints**，
# 把集群外的地址投影成集群内的服务发现条目。
#
# 地址为什么取 172.18.0.1 而不是 PG 容器的 172.18.0.7：
#   172.18.0.1 是 k3d 网络的**网关**，也就是 WSL 宿主。PG 用 -p 5432:5432 把端口发布在宿主上，
#   所以 pod → 172.18.0.1:5432 → 宿主的 docker-proxy → PG 容器。
#   这条路径只依赖「k3d 网络网段」和「PG 发布了宿主端口」，两者都是配置里固定的；
#   而 PG 容器自己的 IP 取决于容器创建顺序，容器一重建就可能变，写进 YAML 会腐化。
#
# 代价（必须知道）：
#   1. 多一跳 NAT，比直连容器 IP 慢一点点（实测握手 0ms 量级，无关紧要）
#   2. 如果哪天 PG 不再发布宿主端口（比如改成 --network 直连不 publish），这条 Endpoints 立刻失效
#   3. 宿主地址变化（换网络）也要改这里
#
# 更彻底的解法是「PG 也进集群」（StatefulSet + 真 Service），那是下一步的事，
# 本轮的目标是先把跨边界的**服务发现**做成声明式的，而不是靠写死 IP。
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: datastore
    app.kubernetes.io/part-of: ai-platform
spec:
  type: ClusterIP
  # 关键：不写 selector —— 由下面手工维护的 Endpoints 决定后端
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres
  namespace: ai-platform
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: datastore
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: postgres
        port: 5432
        protocol: TCP
