# 集群内 PostgreSQL 的凭据。明文不进 Git。
#
# POSTGRES_PASSWORD : 超级用户 postgres 的口令（随机生成）
# init.sql          : 首次初始化时由官方镜像在 /docker-entrypoint-initdb.d 里执行，
#                     建业务角色 app 与两个库。**只在数据目录为空时跑一次** ——
#                     改了这个文件不会对已存在的 PVC 生效，要重建得先删 PVC。
#
# 怎么轮转/怎么重建：见 sre-lab-local/03_runbook/01_SealedSecrets_运行手册.md
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-credentials
  namespace: ai-platform
spec:
  encryptedData:
    POSTGRES_PASSWORD: 
    init.sql: 
  template:
    metadata:
      name: postgres-credentials
      namespace: ai-platform
