# platform api 的凭据。**明文不进 Git**，这里只有密文。
#
# 用的是集群里的 sealed-secrets（kube-system/sealed-secrets-controller v0.40.0）。
# 密文由 RSA-OAEP(SHA-256) + AES-256-GCM 混合加密，只有集群内那把私钥能解，
# 所以这份文件公开躺着也是安全的 —— 泄露它不等于泄露凭据。
#
# scope 是 strict（默认）：name 和 namespace 都绑进密文。
# 也就是说改名字或换命名空间都会解不开，这是刻意的，别随手改 metadata。
#
# DATABASE_DSN 指向集群内的 postgres Service（同目录 postgres-stack.yaml），
# 用完整 FQDN 而不是短名 —— 短名只在同命名空间可用，是个容易踩的坑。
#
# 明文由本机 _secrets/ai-platform-api-secret.txt 留存（该目录不在任何 Git 仓库里）。
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ai-platform-api-secret
  namespace: ai-platform
spec:
  encryptedData:
    SECRET_PEPPER: 
    DATABASE_DSN: 
  template:
    metadata:
      name: ai-platform-api-secret
      namespace: ai-platform
